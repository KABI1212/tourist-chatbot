# ===================================================================
# Tourist Chatbot Application Configuration
# ===================================================================

spring.application.name=tourist-chatbot
server.port=8080

# ── MongoDB Atlas Configuration ──
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tourist_chatbot}
spring.data.mongodb.database=${DATABASE_NAME:tourist_chatbot}

# ── Google Gemini AI Configuration ──
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.model.name=gemini-2.5-flash

# ── JWT Security Configuration ──
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# ── Static Resources & Web Configuration ──
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/,file:./frontend/

# ── Jackson JSON Configuration ──
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Logging Configuration ──
logging.level.root=INFO
logging.level.com.tourist.chatbot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
