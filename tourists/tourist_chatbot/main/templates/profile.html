{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Tourist Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:#1a1410; color:#faf6f0; min-height:100vh; display:flex; flex-direction:column; }
        .navbar { background:rgba(14,10,8,.97); border-bottom:1px solid rgba(255,255,255,.07); padding:0 24px; height:62px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
        .nav-logo { font-family:'Playfair Display',serif; font-size:20px; color:#d4a843; text-decoration:none; }
        .nav-links { display:flex; align-items:center; gap:6px; }
        .nav-links a { color:rgba(255,255,255,.65); text-decoration:none; padding:7px 13px; border-radius:6px; font-size:13px; transition:all .3s; }
        .nav-links a:hover { color:white; background:rgba(255,255,255,.07); }

        .container { max-width:700px; margin:40px auto; padding:0 24px; width:100%; }
        .card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:40px; }
        h1 { font-family:'Playfair Display',serif; font-size:28px; margin-bottom:30px; text-align:center; }
        h1 em { font-style:italic; color:#d4a843; }

        .form-group { margin-bottom:20px; }
        label { display:block; font-size:13px; color:#5a5250; margin-bottom:6px; font-weight:500; letter-spacing:0.5px; }
        .form-control { width:100%; padding:12px 16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:8px; color:#faf6f0; font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:all .3s; }
        .form-control:focus { border-color:rgba(212,168,67,.4); background:rgba(255,255,255,.07); }
        .form-control[readonly] { opacity:.5; cursor:not-allowed; }

        .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 28px; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:all .3s; text-decoration:none; }
        .btn-primary { background:#c0623a; color:white; }
        .btn-primary:hover { background:#a8522f; }
        .btn-secondary { background:rgba(255,255,255,.05); color:rgba(255,255,255,.65); border:1px solid rgba(255,255,255,.1); }
        .btn-secondary:hover { background:rgba(255,255,255,.1); color:white; }

        .alert { padding:12px 16px; border-radius:8px; margin-bottom:20px; font-size:14px; }
        .alert-error { background:rgba(192,98,58,.15); border:1px solid rgba(192,98,58,.3); color:#c0623a; }
        .alert-success { background:rgba(46,204,113,.15); border:1px solid rgba(46,204,113,.3); color:#2ecc71; }

        .actions { display:flex; gap:12px; margin-top:24px; justify-content:center; flex-wrap:wrap; }
        .info-text { font-size:13px; color:#5a5250; text-align:center; margin-top:16px; }
        .info-text a { color:#d4a843; text-decoration:none; }
        .info-text a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'home' %}" class="nav-logo">Tourist Guide</a>
        <div class="nav-links">
            <a href="{% url 'home' %}"><i class="fas fa-house"></i> Home</a>
            <a href="{% url 'chat' %}"><i class="fas fa-comments"></i> Chat</a>
            <a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>My <em>Profile</em></h1>

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            {% if success %}
                <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST" action="{% url 'profile' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" value="{{ profile.username }}" readonly>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" value="{{ profile.email }}" readonly>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="form-control" value="{{ profile.full_name }}" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" class="form-control" value="{{ profile.phone }}" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="3" required>{{ profile.address }}</textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Profile</button>
                    <a href="{% url 'change_password' %}" class="btn btn-secondary"><i class="fas fa-key"></i> Change Password</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
