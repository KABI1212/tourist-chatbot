{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Tourist Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --terracotta:#c0623a; --deep:#1a1410; --gold:#d4a843; --cream:#faf6f0; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:var(--deep); color:var(--cream);
               min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
                border-radius:16px; padding:48px 40px; width:100%; max-width:420px; animation:fadeUp .6s ease both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .logo { font-size:22px; color:var(--gold); font-weight:600; margin-bottom:8px; }
        h2 { font-size:24px; margin-bottom:6px; }
        .sub { font-size:14px; color:#7a706a; margin-bottom:28px; }
        .alert { padding:12px 16px; border-radius:8px; font-size:14px; margin-bottom:20px; }
        .alert-error   { background:rgba(192,98,58,.15); border:1px solid rgba(192,98,58,.4); color:#e8886a; }
        .alert-success { background:rgba(46,204,113,.1); border:1px solid rgba(46,204,113,.3); color:#2ecc71; }
        label { display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase;
                color:#7a706a; margin-bottom:7px; }
        .field { position:relative; margin-bottom:20px; }
        .field i.icon { position:absolute; left:14px; top:50%; transform:translateY(-50%);
                        color:#4a4540; font-size:14px; }
        .toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%);
                  background:none; border:none; color:#4a4540; cursor:pointer; font-size:14px; }
        input { width:100%; padding:12px 40px; background:rgba(255,255,255,.05);
                border:1px solid rgba(255,255,255,.1); border-radius:8px; color:var(--cream);
                font-size:14px; outline:none; transition:border-color .3s; }
        input:focus { border-color:rgba(212,168,67,.5); }
        .strength-bar { display:flex; gap:4px; margin-top:6px; }
        .seg { height:3px; flex:1; border-radius:2px; background:rgba(255,255,255,.1); transition:background .3s; }
        .btn { width:100%; padding:14px; background:var(--terracotta); border:none;
               border-radius:8px; color:white; font-size:15px; cursor:pointer; transition:all .3s; }
        .btn:hover { background:#a8522f; }
        .back { display:block; text-align:center; margin-top:20px; color:#7a706a; font-size:13px; text-decoration:none; }
        .back:hover { color:var(--gold); }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">Tourist Guide</div>
    <h2>Set New Password</h2>
    <p class="sub">Choose a strong password for your account.</p>

    {% if error %}
        <div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="alert alert-success"><i class="fas fa-check-circle"></i> {{ success }}
            <a href="{% url 'login' %}" style="color:var(--gold);margin-left:8px;">Login →</a>
        </div>
    {% endif %}

    {% if not success %}
    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="token" value="{{ token }}">

        <label>New Password</label>
        <div class="field">
            <i class="icon fas fa-lock"></i>
            <input type="password" id="pwd" name="password" placeholder="Min 8 characters"
                   required oninput="checkStrength(this.value)">
            <button type="button" class="toggle" onclick="toggle('pwd','eye1')">
                <i id="eye1" class="fas fa-eye"></i>
            </button>
        </div>
        <div class="strength-bar">
            <div class="seg" id="s1"></div><div class="seg" id="s2"></div>
            <div class="seg" id="s3"></div><div class="seg" id="s4"></div>
        </div>

        <label style="margin-top:16px;">Confirm Password</label>
        <div class="field">
            <i class="icon fas fa-lock"></i>
            <input type="password" id="cpwd" name="confirm_password" placeholder="Repeat password" required>
            <button type="button" class="toggle" onclick="toggle('cpwd','eye2')">
                <i id="eye2" class="fas fa-eye"></i>
            </button>
        </div>

        <button type="submit" class="btn"><i class="fas fa-key"></i> Reset Password</button>
    </form>
    {% endif %}

    <a href="{% url 'login' %}" class="back"><i class="fas fa-arrow-left"></i> Back to Login</a>
</div>
<script>
function toggle(id, iconId) {
    const el = document.getElementById(id);
    const ic = document.getElementById(iconId);
    el.type = el.type === 'password' ? 'text' : 'password';
    ic.className = el.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
function checkStrength(v) {
    const segs = ['s1','s2','s3','s4'].map(id => document.getElementById(id));
    const colors = ['#c0623a','#d4a843','#8BC34A','#2ecc71'];
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    segs.forEach((s,i) => s.style.background = i < score ? colors[score-1] : 'rgba(255,255,255,.1)');
}
</script>
</body>
</html>
