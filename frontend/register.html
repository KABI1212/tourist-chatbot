<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Tourist Guide</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-overlay"></div>
        <div class="auth-card wide">
            <div class="auth-header">
                <a href="index.html" class="nav-logo" style="justify-content:center; margin-bottom:16px;">
                    <div class="logo-badge"><i class="fas fa-compass"></i></div>
                    <span class="logo-text">Tourist Guide</span>
                </a>
                <h2>Create Your Account</h2>
                <p>Join thousands of global travellers exploring smarter with our Spring Boot & Gemini AI platform.</p>
            </div>

            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user"></i> Username *</label>
                        <input type="text" id="username" class="form-control" placeholder="johndoe" required>
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email Address *</label>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName"><i class="fas fa-id-card"></i> Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 000-0000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address"><i class="fas fa-map-marker-alt"></i> Home City / Address</label>
                    <input type="text" id="address" class="form-control" placeholder="City, Country">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password * (min 6 characters)</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-check-double"></i> Confirm Password *</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; margin-top:10px;">
                    <i class="fas fa-user-plus"></i> Complete Registration
                </button>
            </form>

            <div class="auth-footer">
                Already registered? <a href="login.html">Sign In Here</a>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const errBox = document.getElementById('authError');
                const succBox = document.getElementById('authSuccess');
                const btn = document.getElementById('submitBtn');

                errBox.style.display = 'none';
                succBox.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const address = document.getElementById('address').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    errBox.textContent = 'Passwords do not match.';
                    errBox.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering…';

                try {
                    await Auth.register({
                        username,
                        email,
                        fullName,
                        phone,
                        address,
                        password
                    });

                    succBox.textContent = 'Registration successful! Taking you to your travel hub…';
                    succBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'chatbot.html';
                    }, 800);
                } catch (err) {
                    errBox.textContent = err.message || 'Registration failed. Please check your details.';
                    errBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Complete Registration';
                }
            });
        });
    </script>
</body>
</html>
