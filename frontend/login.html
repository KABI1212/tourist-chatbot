<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Tourist Guide</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>

    <div class="auth-page">
        <div class="auth-overlay"></div>
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="nav-logo" style="justify-content:center; margin-bottom:16px;">
                    <div class="logo-badge"><i class="fas fa-compass"></i></div>
                    <span class="logo-text">Tourist Guide</span>
                </a>
                <h2>Welcome Back</h2>
                <p>Sign in to access your travel plans, saved destinations, and personalized AI itineraries.</p>
            </div>

            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; margin-top:10px;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div style="text-align:center; margin:12px 0 8px; font-size:12px; color:var(--slate, #94a3b8);">— OR —</div>

                <button type="button" class="btn btn-outline" id="demoLoginBtn" style="width:100%; border-color:var(--gold, #d4a24c); color:var(--gold, #d4a24c);">
                    <i class="fas fa-bolt"></i> 1-Click Demo Login
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create an Account</a>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === 'true') {
                const s = document.getElementById('authSuccess');
                s.textContent = 'Account created successfully! Please sign in.';
                s.style.display = 'block';
            }
            if (urlParams.get('expired') === 'true') {
                const e = document.getElementById('authError');
                e.textContent = 'Your session has expired. Please log in again.';
                e.style.display = 'block';
            }

            const form = document.getElementById('loginForm');
            const demoBtn = document.getElementById('demoLoginBtn');

            if (demoBtn) {
                demoBtn.addEventListener('click', () => {
                    document.getElementById('username').value = 'demo';
                    document.getElementById('password').value = 'demo123';
                    form.dispatchEvent(new Event('submit'));
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const errBox = document.getElementById('authError');
                const succBox = document.getElementById('authSuccess');
                const btn = document.getElementById('submitBtn');

                errBox.style.display = 'none';
                succBox.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    errBox.textContent = 'Please enter both username and password.';
                    errBox.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';

                try {
                    await Auth.login(username, password);
                    succBox.textContent = 'Login successful! Redirecting…';
                    succBox.style.display = 'block';

                    const redirect = urlParams.get('redirect') || 'chatbot.html';
                    setTimeout(() => {
                        window.location.href = redirect;
                    }, 600);
                } catch (err) {
                    errBox.textContent = err.message || 'Invalid username or password.';
                    errBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            });
        });
    </script>
</body>
</html>
