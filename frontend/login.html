<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TouristAI</title>
    <!-- Google Fonts: Cormorant Garamond & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chatbot.css">
    <!-- Favicon & Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-light-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-dark-16x16.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/brand/icon-192x192.png">
    <meta name="theme-color" content="#11110F">
    <!-- Theme Switcher -->
    <script src="js/theme.js"></script>
</head>
<body style="background:var(--bg-dark); display:flex; flex-direction:column; min-height:100vh;">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <img src="assets/brand/logo-dark.png" alt="Tourist Chatbot Logo" class="brand-logo-img brand-logo-dark">
                <img src="assets/brand/logo-light.png" alt="Tourist Chatbot Logo" class="brand-logo-img brand-logo-light">
                <span>TouristAI</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="destinations.html" class="nav-link">Destinations</a>
                <a href="planner.html" class="nav-link">Plan Trip</a>
                
                <!-- Theme Toggle Button -->
                <button type="button" class="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- AUTH CARD CONTAINER -->
    <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:110px 20px 40px;">
        <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px; max-width:440px; width:100%; box-shadow:var(--shadow-lg);">
            
            <div style="text-align:center; margin-bottom:28px;">
                <img src="assets/brand/logo-dark.png" alt="TouristAI Logo" class="brand-logo-img large brand-logo-dark" style="margin:0 auto 14px; display:block;">
                <img src="assets/brand/logo-light.png" alt="TouristAI Logo" class="brand-logo-img large brand-logo-light" style="margin:0 auto 14px; display:block;">
                <h2 style="font-family:var(--font-display); font-size:28px; color:var(--text-main); font-weight:700; margin-bottom:6px;">Welcome Back</h2>
                <p style="color:var(--text-muted); font-size:14px;">Sign in to access saved journeys, personalized itineraries, and travel history.</p>
            </div>

            <div id="authAlert" style="display:none; padding:12px 16px; border-radius:8px; font-size:13.5px; margin-bottom:18px;"></div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-field">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. demo" required autofocus>
                </div>

                <div class="form-field">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width:100%; margin-top:8px;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div style="text-align:center; margin:16px 0; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;">
                    Or quick demo access
                </div>

                <button type="button" class="btn btn-outline" onclick="fillDemoAndLogin()" style="width:100%; border-color:var(--accent-gold); color:var(--accent-gold);">
                    <i class="fas fa-bolt"></i> 1-Click Demo Login (demo / demo123)
                </button>
            </form>

            <div style="text-align:center; margin-top:24px; font-size:13.5px; color:var(--text-muted);">
                Don't have an account? <a href="register.html" style="color:var(--accent-gold); font-weight:600;">Create Account</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('authAlert');
            if (params.get('registered') === 'true') {
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(16,185,129,0.15)';
                alertBox.style.color = '#34D399';
                alertBox.textContent = 'Account registered successfully! Please log in.';
            } else if (params.get('expired') === 'true') {
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(244,63,94,0.15)';
                alertBox.style.color = '#F43F5E';
                alertBox.textContent = 'Your session expired. Please sign in again.';
            }
        });

        function fillDemoAndLogin() {
            document.getElementById('username').value = 'demo';
            document.getElementById('password').value = 'demo123';
            handleLoginSubmit(new Event('submit'));
        }

        async function handleLoginSubmit(e) {
            if (e && e.preventDefault) e.preventDefault();
            const alertBox = document.getElementById('authAlert');
            alertBox.style.display = 'none';

            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const btn = document.getElementById('loginSubmitBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';

            try {
                await Auth.login(u, p);
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(16,185,129,0.15)';
                alertBox.style.color = '#34D399';
                alertBox.textContent = 'Welcome back! Redirecting…';

                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect') || 'dashboard.html';
                setTimeout(() => {
                    window.location.href = redirect;
                }, 400);
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(244,63,94,0.15)';
                alertBox.style.color = '#F43F5E';
                alertBox.textContent = err.message || 'Invalid username or password.';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        }
    </script>
</body>
</html>
